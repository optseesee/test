Q7: |  
    # 問題文  
    ある商品の税抜価格はN円です。消費税率が10%であるとき、この商品の税込価格が何円であるかを出力するプログラムを作成してください。ただし、Nは100の倍数であるとします。  
  
    制約  
    1≦N≦10^6  
    Nは100の倍数  
  
    入力は以下の形式で標準入力から与えられます。Python で受ける場合は input() を使ってください。  
    N  
  
    出力  
    商品の税込価格を標準出力に1行で出力してください。  
  
    入力例 1  
    800  
  
    出力例 1  
    880  
Q8: |  
    # 問題文  
    今日、KYOPRO国では総選挙が行われました。N個の党が立候補し、i番目の党はA_i票を獲得しました。比例代表制にしたがってK議席を配分するとき、各党は何議席を獲得しますか。  
  
    ただし比例代表制では、以下の表のように「票数÷議席数」の大きい方から議席を割り当てていきます（ドント方式といいます）。  
  
    制約  
    2≤N≤100000  
    1≤K≤10^9  
    1≤A_i  
    A_1+A_2+⋯+A_N≤10^9  
    ボーダーとなる「票数÷議席数」の値は1を超え10^9未満である  
    ボーダーとなる「票数÷議席数」と、次点の「票数÷議席数」の相対誤差は10^(−6)を超える  
    入力はすべて整数  
  
    入力は以下の形式で標準入力から与えられます。Python で受ける場合は input() を使ってください。 
    N K  
    A_1  
    A_2  
    ⋯  
    A_N  
  
    出力  
    答えを整数で出力してください。  
  
    入力例 1  
    4 10  
    1000000 700000 300000 180000  
  
    出力例 1  
    5 3 1 1  
  
    入力例 2  
    2 3  
    6000 3000  
  
    出力例 2  
    2 1  
  
    この入力は制約を満たしますが、もしA=[6000,3000]かつK=2である場合はボーダーが同点となるため、制約を満たさないことに注意してください（このような入力は絶対に与えられません）。  
  
    入力例 3  
    15 50  
    18256245 7845995 6771945 6181431 3618432 3159625 2319156 1768385 1258501 1253872 193724 148020 109045 77861 6  
  
    出力例 3  
    18 8 7 6 3 3 2 1 1 1 0 0 0 0 0  
  
    入力例 4  
    2 1  
    900000000 100000000  
  
    出力例 4  
    1 0  
Q9: |
    # 問題文:
    高橋君はゲームをプレイしています。  
      
    ゲームは 1, 2, ..., N の番号がついた N 個のステージからなり、現在はステージ 1 のみを遊ぶことができます。  
      
    各ステージ i (1 ≤ i ≤ N-1) が遊べるとき、ステージ i では以下の 2 つのどちらかの行動を行えます。  
      
      - A_i 秒掛けてステージ i をクリアする。ステージ i + 1 を遊べるようになる。  
      - B_i 秒掛けてステージ i をクリアする。ステージ X_i を遊べるようになる。  
      
      各ステージをクリアするためにかかる時間 A_i, B_i は無視できるとき、ステージ N を遊べるようになるのは最短で何秒後ですか？  
      
    制約:  
      - 2 ≤ N ≤ 2 × 10^5  
      - 1 ≤ A_i, B_i ≤ 10^9  
      - 1 ≤ X_i ≤ N  
      - 入力は全て整数  
      
    入力:
      入力は以下の形式で標準入力から与えられる。  
      ```
      N
      A_1 B_1 X_1
      A_2 B_2 X_2
      :
      :
      A_{N-1} B_{N-1} X_{N-1}
      ```
      
    出力: "答えを出力せよ。"  
      
    入力例:  
    - id: 1  
      data:
        ```  
        5  
        100 200 3  
        50 10 1  
        100 200 5  
        150 1 2  
        ```  
      出力:
        ```  
        350  
        ```  
      解説:
        次のように行動することで、350 秒でステージ 5 を遊べるようになります。  
        - 100 秒掛けてステージ 1 をクリアし、ステージ 2 を遊べるようになる。  
        - 50 秒掛けてステージ 2 をクリアし、ステージ 3 を遊べるようになる。  
        - 200 秒掛けてステージ 3 をクリアし、ステージ 5 を遊べるようになる。  

    - id: 2  
      data:
        ```  
        10  
        1000 10 9  
        1000 10 8  
        1000 10 7  
        1000 10 6  
        1000 10 5  
        1000 10 4  
        1000 10 3  
        1000 10 2  
        1000 10 1  
        1000 10 8  
        ```  
      出力:
        ```  
        90  
        ```  

    - id: 3  
      data:
        ```  
        6  
        1000000000 1000000000 1  
        1000000000 1000000000 1  
        1000000000 1000000000 1  
        1000000000 1000000000 1  
        1000000000 1000000000 1  
        1000000000 1000000000 1  
        ```  
      出力:
        ```  
        5000000000  
        ```

Q10: |
    # 問題文  
      
    AtCoder社ではカードを使った1人ゲームが流行っています。    
    ゲームで使う各カードには、英小文字または @ の文字が書かれており、いずれのカードも十分多く存在します。  
      
    ゲームは以下の手順で行います。  
      
    1. カードを同じ枚数ずつ2列に並べる。  
    2. 各列のカードを、それぞれ s_1, s_2, ..., s_n, t_1, t_2, ..., t_n の n 枚のカードと置き換える。  
    3. 2つの列が一致しないとゲームに勝てない。さもなければ負け。  
      
    このゲームに勝ちたいあなたは、次のようなイカサマをすることにしました。  
      
    - 手順 1 以降の好きなタイミングで、列内のカードを自由に並び替えてよい。  
      
    手順1で並べられた2列の文字列 S と T が与えられるので、イカサマをしてもよいときゲームに勝てるか判定してください。  
      
    # 制約  
      
    - S, T は英小文字と @ からなる  
    - S, T の長さは等しく、1 以上 2 × 10^5 以下  
      
    # 入力  
      
    入力は以下の形式で標準入力から与えられる。  
      
    ```
    S
    T
    ```
      
    # 出力  
      
    イカサマをしてもよいとき、ゲームに勝てるなら Yes、勝てないなら No と出力せよ。  
      
    # 入力例1  
    ```
    ch@ku@ai
    chokudai
    ```
      
    # 出力例1  
    ```
    Yes
    ```
      
    @ をうまく置き換えることによって、両方とも chokudai と一致させることが可能です。  
      
    # 入力例2  
    ```
    ch@ku@ai
    akid@ho
    ```
      
    # 出力例2  
    ```
    Yes
    ```
      
    @ をうまく置き換えることによって、両方とも chokudai と一致させることが可能です。  
      
    # 入力例3  
    ```
    aoki
    @ek@
    ```
      
    # 出力例3  
    ```
    No
    ```
      
    イカサマをしても勝つことはできません。  
      
    # 入力例4  
    ```
    aa
    bb
    ```
      
    # 出力例4  
    ```
    No
    ```
      
    イカサマをしても勝つことはできません。

